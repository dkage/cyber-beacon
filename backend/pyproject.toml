[project]
name = "cyber-beacon"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "Django>=5.2,<5.3", "djangorestframework>=3.16,<3.17",
  "drf-spectacular>=0.29,<0.30", "django-allauth[headless]>=65,<66",
  "django-q2>=1.9,<2", "psycopg[binary]>=3.2,<4",
  "cryptography>=46,<47", "httpx>=0.28,<0.29", "gunicorn>=23,<24",
  "whitenoise>=6.9,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.11,<5", "ruff>=0.14,<0.15"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501"]
