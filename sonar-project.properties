sonar.projectKey=CB
sonar.projectName=Cyber-Beacon

sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,**/vendor/**,**/dist/**,**/build/**,frontend/.svelte-kit/**

# --- Enable when you have tests ---
# Go:    add *_test.go files, then uncomment:
# sonar.go.coverage.reportPaths=backend/coverage.out
#
# Frontend: set up Vitest emitting lcov, then uncomment:
# sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
# sonar.tests=backend,frontend/src
# sonar.test.inclusions=**/*_test.go,**/*.test.ts,**/*.spec.ts
